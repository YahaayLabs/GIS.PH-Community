name: API bug (api.gis.ph)
description: Something wrong when calling the GIS.PH API
title: "[api] "
labels: ["bug", "api", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Report a defect against **api.gis.ph**. Do **not** paste API keys, Clerk tokens, or other secrets.
        Unsure if it is a bug? Start a [Q&A Discussion](https://github.com/YahaayLabs/GIS.PH-Community/discussions/categories/q-a) first.
  - type: input
    id: endpoint
    attributes:
      label: Endpoint / request
      description: Method + path (and important query params). Example — `GET /v1/barangays?q=lahug`
      placeholder: GET /v1/...
    validations:
      required: true
  - type: dropdown
    id: auth
    attributes:
      label: Auth used
      options:
        - API key (gis_sk_*)
        - Dashboard / Clerk session (via BFF)
        - None / public
        - Other / not sure
    validations:
      required: true
  - type: dropdown
    id: environment
    attributes:
      label: Environment
      options:
        - Production (https://api.gis.ph)
        - Local / self-hosted
        - Not sure
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include HTTP status and response body snippet (redact secrets).
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Minimal curl, SDK snippet, or numbered steps.
      value: |
        1.
        2.
        3.
    validations:
      required: true
  - type: input
    id: when
    attributes:
      label: When did this happen?
      description: Approximate date/time and timezone (optional).
  - type: textarea
    id: extra
    attributes:
      label: Extra context
      description: Client (curl, SDK, browser), request id if any, screenshots.
